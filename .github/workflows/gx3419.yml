name: gx3419-coverage-sync

on:
  schedule:
    - cron: '47 2,11,14 * * 1-6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gx3419-coverage-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check upstream credentials
        env:
          GX3419_SOURCE_TOKEN: ${{ secrets.GX3419_SOURCE_TOKEN }}
        run: |
          if [ -z "$GX3419_SOURCE_TOKEN" ]; then
            echo "::error::Configure GX3419_SOURCE_TOKEN with Contents read access to 3419-covered-call-monitor."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Check out upstream data
        uses: actions/checkout@v4
        with:
          repository: oldrabbitcn88/3419-covered-call-monitor
          ref: main
          token: ${{ secrets.GX3419_SOURCE_TOKEN }}
          path: _gx3419_source
          sparse-checkout: |
            data
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Import daily coverage
        run: python -m backend.tools.sync_gx3419 _gx3419_source/data

      - name: Publish updated coverage files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/data/gx3419/coverage.csv deploy/data/gx3419/coverage.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(data): sync 3419 coverage [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
