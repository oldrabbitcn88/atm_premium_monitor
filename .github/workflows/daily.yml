name: daily-atm-premium

on:
  schedule:
    - cron: '40 7 * * 1-5'   # UTC 07:40 = 北京时间 15:40（A股收盘后）
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deploy/frontend/**'
      - 'deploy/data/**'
      - 'deploy/actions/**'
      - '.github/workflows/daily.yml'

permissions:
  contents: write             # 回写 data.json

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests coscmd

      - name: 运行计算（CSI300/CSI500）
        id: build
        env:
          TZ: Asia/Shanghai
        run: python deploy/actions/build_data.py

      - name: 回写 data.json 到仓库（保证新数据点跨次运行不丢失）
        if: steps.build.outputs.data_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/data/data.json
          git commit -m "chore(data): 自动更新 data.json [skip ci]"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      # ---- 数据与静态资源上传 COS ----
      # fetch() 与 <script src> 都不读 Content-Disposition，
      # 所以 COS 的强制下载策略对这几个文件无影响，可放心走 COS 默认域名。
      - name: 配置 coscmd
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
        run: coscmd config -a "$COS_SECRET_ID" -s "$COS_SECRET_KEY" -b "$COS_BUCKET" -r "$COS_REGION"

      - name: 上传数据到 COS
        run: |
          coscmd upload deploy/data/data.json /data.json \
            -H '{"Content-Type":"application/json;charset=utf-8","Cache-Control":"no-cache"}'
          coscmd upload deploy/data/hsi.json /hsi.json \
            -H '{"Content-Type":"application/json;charset=utf-8","Cache-Control":"no-cache"}'

      # ---- 前端页面部署到 CloudBase 静态网站托管 ----
      # COS 默认域名对 HTML 强制下载（2024 后建的桶，平台策略，元数据覆盖不掉），
      # 所以唯一需要被浏览器渲染的 index.html 走 CloudBase，默认域名免备案。
      # 数据仍留在 COS：fetch() 不读 Content-Disposition，且改数据无需重新部署页面。
      # 站点地址（注意默认域名带 APPID 后缀，不是纯 envId）：
      #   https://atm-premium-yield-d2dab164c1808d-1341815007.tcloudbaseapp.com/
      - name: 部署页面到 CloudBase
        env:
          # 注意：CloudBase 环境与 COS 桶不在同一个腾讯云账号下
          #   COS 桶  premium-yield-1341808236        → APPID 1341808236（旧账号）
          #   CloudBase ...-1341815007.tcloudbaseapp  → APPID 1341815007（新账号）
          # 所以这里必须用新账号的密钥，不能复用 COS_SECRET_*
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
          TCB_ENV_ID: atm-premium-yield-d2dab164c1808d
        run: |
          if [ -z "$TCB_SECRET_ID" ] || [ -z "$TCB_SECRET_KEY" ]; then
            echo "::error::缺少 TCB_SECRET_ID / TCB_SECRET_KEY（CloudBase 所在账号的 API 密钥）"
            echo "在仓库 Settings → Secrets and variables → Actions 添加后重跑"
            exit 1
          fi
          npm install -g @cloudbase/cli
          cloudbase login --apiKeyId "$TCB_SECRET_ID" --apiKey "$TCB_SECRET_KEY"
          cloudbase hosting deploy deploy/frontend / -e "$TCB_ENV_ID" --verify
