name: daily-atm-premium

on:
  schedule:
    - cron: '40 7 * * 1-5'   # UTC 07:40 = 北京时间 15:40（交易日收盘后）
  workflow_dispatch:          # 支持手动触发
  push:                       # 前端/数据改动后自动重新发布（含本机推送的 hsi.json）
    branches: [main]
    paths:
      - 'deploy/frontend/**'
      - 'deploy/data/**'
      - 'deploy/actions/**'
      - '.github/workflows/daily.yml'

permissions:
  contents: write             # 回写 data.json
  pages: write                # 发布 GitHub Pages
  id-token: write             # deploy-pages 需要

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 运行计算（CSI300/CSI500）
        id: build
        env:
          TZ: Asia/Shanghai
        run: python deploy/actions/build_data.py

      - name: 回写 data.json 到仓库（保证新数据点跨次运行不丢失）
        if: steps.build.outputs.data_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/data/data.json
          git commit -m "chore(data): 自动更新 data.json [skip ci]"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: 组装站点（index.html 与两个 json 同目录）
        run: |
          mkdir -p _site
          cp deploy/frontend/index.html _site/index.html
          cp deploy/data/data.json _site/data.json
          cp deploy/data/hsi.json _site/hsi.json
          touch _site/.nojekyll
          ls -l _site

      - name: 上传 Pages 制品
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
