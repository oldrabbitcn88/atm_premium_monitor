name: daily-atm-premium

on:
  schedule:
    - cron: '40 7 * * 1-5'   # UTC 07:40 = 北京时间 15:40（交易日收盘后）
  workflow_dispatch:          # 支持手动触发

permissions:
  contents: write             # 需要把更新后的 data.json 提交回仓库

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests coscmd

      - name: 运行计算（CSI300/CSI500）
        id: build
        env:
          TZ: Asia/Shanghai
        run: python deploy/actions/build_data.py

      - name: 回写 data.json 到仓库（保证新数据点跨次运行不丢失）
        if: steps.build.outputs.data_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/data/data.json
          git commit -m "chore(data): 自动更新 data.json [skip ci]"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: 配置 coscmd
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
        run: |
          coscmd config -a "$COS_SECRET_ID" -s "$COS_SECRET_KEY" -b "$COS_BUCKET" -r "$COS_REGION"

      - name: 上传 COS
        run: |
          coscmd upload deploy/data/data.json /data.json \
            --metas '{"Content-Type":"application/json;charset=utf-8","Content-Disposition":"inline","Cache-Control":"no-cache"}'
          coscmd upload deploy/frontend/index.html /index.html \
            --metas '{"Content-Type":"text/html;charset=utf-8","Content-Disposition":"inline","Cache-Control":"no-cache"}'
