name: daily-atm-premium

on:
  schedule:
    - cron: '40 7 * * 1-5'   # UTC 07:40 = 北京时间 15:40（A股收盘后）
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deploy/frontend/**'
      - 'deploy/data/**'
      - 'deploy/actions/**'
      - '.github/workflows/daily.yml'

permissions:
  contents: write             # 回写 data.json

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests coscmd

      - name: 运行计算（CSI300/CSI500）
        id: build
        env:
          TZ: Asia/Shanghai
        run: python deploy/actions/build_data.py

      - name: 回写 data.json 到仓库（保证新数据点跨次运行不丢失）
        if: steps.build.outputs.data_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/data/data.json
          git commit -m "chore(data): 自动更新 data.json [skip ci]"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      # ---- 数据与静态资源上传 COS ----
      # fetch() 与 <script src> 都不读 Content-Disposition，
      # 所以 COS 的强制下载策略对这几个文件无影响，可放心走 COS 默认域名。
      - name: 配置 coscmd
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
        run: coscmd config -a "$COS_SECRET_ID" -s "$COS_SECRET_KEY" -b "$COS_BUCKET" -r "$COS_REGION"

      - name: 上传数据到 COS
        run: |
          coscmd upload deploy/data/data.json /data.json \
            --metas '{"Content-Type":"application/json;charset=utf-8","Cache-Control":"no-cache"}'
          coscmd upload deploy/data/hsi.json /hsi.json \
            --metas '{"Content-Type":"application/json;charset=utf-8","Cache-Control":"no-cache"}'

      # 前端页面不在这里部署：静态托管产品（EdgeOne Pages）直接对接本仓库，
      # 检测到 push 后自行拉取 deploy/frontend/ 构建发布。
      # COS 默认域名对 HTML 强制下载（2024 后建的桶，平台策略，metas 覆盖不掉），
      # 所以 index.html 不能走 COS；但 data.json/hsi.json 走 COS 完全没问题，
      # 因为 fetch() 不读 Content-Disposition。
