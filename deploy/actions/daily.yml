name: daily-atm-premium

on:
  schedule:
    - cron: '40 7 * * 1-5'   # UTC 07:40 = 北京时间 15:40（交易日收盘后）
  workflow_dispatch:          # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests coscmd

      - name: 运行计算（CSI300/CSI500）
        env:
          TZ: Asia/Shanghai
        run: python deploy/actions/build_data.py

      - name: 配置 coscmd
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
        run: |
          coscmd config -a "$COS_SECRET_ID" -s "$COS_SECRET_KEY" -b "$COS_BUCKET" -r "$COS_REGION"

      - name: 上传 COS
        run: |
          coscmd upload deploy/data/data.json /data.json
          coscmd upload deploy/frontend/index.html /index.html --metas '{"Content-Type":"text/html"}'

